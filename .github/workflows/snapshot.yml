name: Tag Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: release-version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($GITHUB_REF_NAME) does not match package.json ($PACKAGE_VERSION)" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Transmission version
        run: pnpm run build:transmission

      - name: Build qBittorrent version
        run: pnpm run build:qbittorrent

      - name: Compress release files
        shell: bash
        run: |
          VERSION="${{ steps.release-version.outputs.version }}"
          (cd dist-transmission && zip -r "../bitcake-${VERSION}-transmission.zip" .)
          (cd dist-qbittorrent/public && zip -r "../../bitcake-${VERSION}-qbittorrent.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.version }}
          body: |
            Automated build from tag `${{ steps.release-version.outputs.tag }}` and commit `${{ github.sha }}`.

            ## 📦 Build Artifacts
            - `bitcake-${{ steps.release-version.outputs.version }}-transmission.zip` - Transmission 客户端版本
            - `bitcake-${{ steps.release-version.outputs.version }}-qbittorrent.zip` - qBittorrent 客户端版本

            ## 🐳 Docker Image
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/bitcake:${{ steps.release-version.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/bitcake:latest
            ```
          prerelease: false
          files: |
            bitcake-${{ steps.release-version.outputs.version }}-transmission.zip
            bitcake-${{ steps.release-version.outputs.version }}-qbittorrent.zip

      # Docker 镜像构建和推送
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitcake
          tags: |
            type=raw,value=${{ steps.release-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
